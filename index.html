<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Земли Крыма | Торги</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body, html {
            margin: 0;
            padding: 0;
            height: 100%;
            background-color: #18222d;
            color: #ffffff;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        }
        #app {
            display: flex;
            flex-direction: column;
            height: 100vh;
        }
        header {
            padding: 12px 16px;
            background: rgba(24, 34, 45, 0.95);
            box-shadow: 0 2px 8px rgba(0,0,0,0.3);
            z-index: 1000;
        }
        .header-title { font-size: 16px; font-weight: 700; }
        .header-subtitle { font-size: 12px; color: #8ab4f8; margin-top: 2px; }
        .filters {
            display: flex;
            gap: 8px;
            padding: 8px 16px;
            overflow-x: auto;
            background: rgba(24, 34, 45, 0.9);
            z-index: 1000;
        }
        .chip {
            background: #2b3847;
            color: #fff;
            border: none;
            padding: 6px 12px;
            border-radius: 16px;
            font-size: 13px;
            white-space: nowrap;
            cursor: pointer;
        }
        .chip.active { background: #2481cc; }
        #map { flex-grow: 1; width: 100%; background: #10171d; }
        .custom-marker {
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 50%;
            color: white;
            font-weight: bold;
            font-size: 12px;
            box-shadow: 0 2px 6px rgba(0,0,0,0.4);
            border: 2px solid #fff;
        }
        .marker-high { background-color: #2ecc71; }
        .marker-mid { background-color: #e67e22; }
    </style>
</head>
<body>
    <div id="app">
        <header>
            <div class="header-title">🗺️ Земли Крыма | Торги</div>
            <div class="header-subtitle">ИЖС & ЛПХ • Онлайн сканер</div>
        </header>

        <div class="filters">
            <button class="chip active" onclick="filterLots('all')">Все участки</button>
            <button class="chip" onclick="filterLots('hot')">🔥 Выгода >50%</button>
            <button class="chip" onclick="filterLots('yalta')">Ялта / ЮБК</button>
        </div>

        <div id="map"></div>
    </div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        let tg = window.Telegram.WebApp;
        tg.expand();

        const map = L.map('map', { zoomControl: false }).setView([44.9521, 34.1024], 9);

        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            maxZoom: 19,
            attribution: '© OpenStreetMap'
        }).addTo(map);

        let allLots = [];
        let markersLayer = L.layerGroup().addTo(map);

        // Подгружаем данные из lots.json
        fetch('./lots.json?v=' + new Date().getTime())
            .then(response => response.json())
            .then(data => {
                allLots = data;
                renderMarkers(allLots);
            })
            .catch(err => console.error("Ошибка загрузки участков:", err));

        function renderMarkers(data) {
            markersLayer.clearLayers();
            data.forEach(lot => {
                let colorClass = lot.discount <= -50 ? 'marker-high' : 'marker-mid';
                let htmlIcon = L.divIcon({
                    className: 'custom-marker ' + colorClass,
                    html: `<span>${lot.discount}%</span>`,
                    iconSize: [40, 40]
                });

                let marker = L.marker([lot.lat, lot.lng], { icon: htmlIcon });
                marker.bindPopup(`<b>${lot.title}</b><br>Старт: ${lot.price || 'по запросу'}<br>Выгода: ${lot.discount}%`);
                markersLayer.addLayer(marker);
            });
        }

        function filterLots(type) {
            document.querySelectorAll('.chip').forEach(btn => btn.classList.remove('active'));
            event.target.classList.add('active');

            if (type === 'all') {
                renderMarkers(allLots);
            } else if (type === 'hot') {
                renderMarkers(allLots.filter(l => l.discount <= -50));
            } else if (type === 'yalta') {
                renderMarkers(allLots.filter(l => l.title.includes('Ялта')));
            }
        }
    </script>
</body>
</html>
