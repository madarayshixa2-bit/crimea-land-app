<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Земли Крыма | Торги</title>
    <!-- Telegram Web App SDK -->
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <!-- Leaflet CSS -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        :root {
            --tg-theme-bg-color: #18222d;
            --tg-theme-text-color: #ffffff;
            --tg-theme-hint-color: #8ab4f8;
            --tg-theme-button-color: #2481cc;
            --tg-theme-button-text-color: #ffffff;
        }
        body, html {
            margin: 0;
            padding: 0;
            height: 100%;
            background-color: var(--tg-theme-bg-color, #18222d);
            color: var(--tg-theme-text-color, #ffffff);
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }
        #app {
            display: flex;
            flex-direction: column;
            height: 100vh;
        }
        header {
            padding: 12px 16px;
            background: rgba(24, 34, 45, 0.95);
            box-shadow: 0 2px 8px rgba(0,0,0,0.3);
            z-index: 1000;
        }
        .header-title {
            font-size: 16px;
            font-weight: 700;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .header-subtitle {
            font-size: 12px;
            color: #8ab4f8;
            margin-top: 2px;
        }
        .filters {
            display: flex;
            gap: 8px;
            padding: 8px 16px;
            overflow-x: auto;
            background: rgba(24, 34, 45, 0.9);
            z-index: 1000;
            scrollbar-width: none;
        }
        .filters::-webkit-scrollbar {
            display: none;
        }
        .chip {
            background: #2b3847;
            color: #fff;
            border: none;
            padding: 6px 12px;
            border-radius: 16px;
            font-size: 13px;
            white-space: nowrap;
            cursor: pointer;
            transition: background 0.2s;
        }
        .chip.active {
            background: #2481cc;
        }
        #map {
            flex-grow: 1;
            width: 100%;
            background: #10171d;
        }
        /* Стили кастомных маркеров */
        .custom-marker {
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 50%;
            color: white;
            font-weight: bold;
            font-size: 12px;
            box-shadow: 0 2px 6px rgba(0,0,0,0.4);
            border: 2px solid #fff;
        }
        .marker-high { background-color: #2ecc71; }
        .marker-mid { background-color: #e67e22; }
    </style>
</head>
<body>
    <div id="app">
        <header>
            <div class="header-title">
                <span>🗺️ Земли Крыма | Торги</span>
            </div>
            <div class="header-subtitle">ИЖС & ЛПХ • Онлайн сканер</div>
        </header>

        <div class="filters">
            <button class="chip active" onclick="filterLots('all')">Все участки</button>
            <button class="chip" onclick="filterLots('hot')">🔥 Выгода >50%</button>
            <button class="chip" onclick="filterLots('yalta')">Ялта / ЮБК</button>
        </div>

        <div id="map"></div>
    </div>

    <!-- Leaflet JS -->
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        // Инициализация Telegram WebApp
        let tg = window.Telegram.WebApp;
        tg.expand();

        // Центр Крыма (Симферополь/Бахчисарай)
        const map = L.map('map', {
            zoomControl: false
        }).setView([44.9521, 34.1024], 9);

        // Добавляем бесплатную подложку OpenStreetMap (без водяных знаков Carto)
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            maxZoom: 19,
            attribution: '© OpenStreetMap'
        }).addTo(map);

        // Эмуляция данных участков (позже заменим на реальный парсер)
        const lots = [
            id = 1, lat: 44.95, lng: 34.10, discount: -64, title: "ИЖС Симферопольский р-н" },
            { id: 2, lat: 44.50, lng: 34.16, discount: -37, title: "ЛПХ ЮБК (Ялта)" },
            { id: 3, lat: 45.35, lng: 36.46, discount: -85, title: "ИЖС г. Керчь" },
            { id: 4, lat: 44.61, lng: 33.52, discount: -60, title: "ИЖС Севастополь" },
            { id: 5, lat: 44.48, lng: 34.58, discount: -48, title: "ЛПХ Алушта" },
            { id: 6, lat: 45.18, lng: 33.36, discount: -80, title: "ИЖС Евпатория" }
        ];

        let markersLayer = L.layerGroup().addTo(map);

        function renderMarkers(data) {
            markersLayer.clearLayers();
            data.forEach(lot => {
                let colorClass = lot.discount <= -70 ? 'marker-high' : 'marker-mid';
                let htmlIcon = L.divIcon({
                    className: 'custom-marker ' + colorClass,
                    html: `<span>${lot.discount}%</span>`,
                    iconSize: [40, 40]
                });

                let marker = L.marker([lot.lat, lot.lng], { icon: htmlIcon });
                marker.bindPopup(`<b>${lot.title}</b><br>Выгода: ${lot.discount}%<br><a href="#" onclick="alert('Детали лота скоро будут доступны!')">Открыть лот</a>`);
                markersLayer.addLayer(marker);
            });
        }

        renderMarkers(lots);

        function filterLots(type) {
            // Переключение активных кнопок
            document.querySelectorAll('.chip').forEach(btn => btn.classList.remove('active'));
            event.target.classList.add('active');

            if (type === 'all') {
                renderMarkers(lots);
            } else if (type === 'hot') {
                renderMarkers(lots.filter(l => l.discount <= -60));
            } else if (type === 'yalta') {
                renderMarkers(lots.filter(l => l.title.includes('Ялта') || l.title.includes('Алушта')));
            }
        }
    </script>
</body>
</html>
